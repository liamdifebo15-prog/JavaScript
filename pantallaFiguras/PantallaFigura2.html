<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla Figuras</title>
<style>
  body { font-family: Arial, sans-serif; margin: 25px; }
  .ventana { width: 320px; background: #dddddd; border: 1px solid #777; }
  .barra { background: #0000aa; color: white; padding: 5px 7px; font-size: 13px; }
  .contenido { padding: 18px 22px 20px; }
  .fila { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  label { width: 100px; font-size: 13px; }
  input { width: 110px; box-sizing: border-box; }
  select { width: 130px; }
  button { margin: 12px 0 0 40px; width: 90px; }
  #fecha { text-align: right; margin: 5px 5px 0; font-size: 13px; }
</style>
<script type="text/javascript">
var figuras = ["Cuadrado", "Rectangulo", "Triangulo", "Circulo", "Poligono"];
var campos = {
  Cuadrado: ["Nombre", "Lado"],
  Rectangulo: ["Nombre", "Base", "Altura"],
  Triangulo: ["Nombre", "Base", "Altura"],
  Circulo: ["Nombre", "Radio"],
  Poligono: ["Nombre", "Lado", "Nro de lados", "Apotema"]
};
function iniciar() {
  var selector = document.getElementById("figura");
  for (var i = 0; i < figuras.length; i++) {
    var opcion = document.createElement("option");
    opcion.value = figuras[i];
    opcion.textContent = figuras[i];
    selector.appendChild(opcion);
  }
  mostrarCampos();
  mostrarFecha();
}
function mostrarCampos() {
  var figura = document.getElementById("figura").value;
  var contenedor = document.getElementById("campos");
  contenedor.innerHTML = "";
  for (var i = 0; i < campos[figura].length; i++) {
    var fila = document.createElement("div");
    fila.className = "fila";
    var etiqueta = document.createElement("label");
    etiqueta.textContent = campos[figura][i];
    var entrada = document.createElement("input");
    entrada.type = "text";
    entrada.name = campos[figura][i];
    fila.appendChild(etiqueta);
    fila.appendChild(entrada);
    contenedor.appendChild(fila);
  }
}
function mostrarFecha() {
  var fecha = new Date();
  var dia = String(fecha.getDate()).padStart(2, "0");
  var mes = String(fecha.getMonth() + 1).padStart(2, "0");
  var anio = fecha.getFullYear();
  document.getElementById("fecha").textContent = dia + "/" + mes + "/" + anio;
}
function validarVacio() {
  var entradas = document.querySelectorAll("#campos input");
  for (var i = 0; i < entradas.length; i++) {
    if (entradas[i].value.trim() == "") {
      alert("Los campos no pueden estar vacíos");
      entradas[i].focus();
      return false;
    }
  }
  return false; // El ejercicio pide validar, no enviar datos a un servidor.
}
</script>
</head>
<body onload="iniciar()">
<div class="ventana">
  <div class="barra">Pantalla Figuras</div>
  <div id="fecha"></div>
  <div class="contenido">
    <form id="formulario" onsubmit="return validarVacio()">
      <div class="fila">
        <label for="figura">Seleccione Figura</label>
        <select id="figura" onchange="mostrarCampos()"></select>
      </div>
      <div id="campos"></div>
      <button type="submit">Enviar</button>
    </form>
  </div>
</div>
</body>
</html>
